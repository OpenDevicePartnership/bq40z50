# Keep each revision's generated Rust in sync with its DDSL source.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: device-driver-pregen-check
jobs:
  device-driver-pregen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: device-driver-pregen-check
    strategy:
      matrix:
        chip-rev: [r1, r3, r4, r5]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Check generated device driver
        uses: tullom/device-driver-pregen-check@v1.2.0
        with:
          source: device_${{ matrix.chip-rev }}.ddsl
          generated-file: src/versions/gen_${{ matrix.chip-rev }}.rs
          cli-version: '2.1.0'
          rust-toolchain: '1.94.0'
          rust-defmt-feature: defmt-03
